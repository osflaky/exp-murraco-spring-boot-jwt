name: CI

on:
  workflow_dispatch:

jobs:
  test:
    strategy:
      fail-fast: false
      matrix:
        include:
        - os: macos-latest
          arch: arm64
          runner: macos-latest
          expander_leg: macos-latest--arm64
    runs-on: ${{ matrix.runner }}
    steps:
    - uses: actions/checkout@v7

    - name: Set up JDK 17
      uses: actions/setup-java@v5.7.0
      with:
        java-version: '17'
        distribution: ${{ matrix.distribution || 'temurin' }}
        cache: maven

    - name: Run tests
      run: ./mvnw -B test
    name: test [${{ matrix.expander_leg }}]
    timeout-minutes: 150
